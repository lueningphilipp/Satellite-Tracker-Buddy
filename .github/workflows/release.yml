# Publishes a GitHub Release with the compiled firmware + an OTA manifest
# whenever a `fw-vX.Y.Z` tag is pushed. Releasing is just:
#
#   git tag -a fw-v1.0.0 -m "..."
#   git push origin fw-v1.0.0
#
# Nothing is hand-edited - the tag is the single source of truth for the
# version (see firmware/extra_script.py), and this workflow refuses to
# publish anything whose compiled version wouldn't be a clean x.y.z. The
# release notes are the tag's own `-m "..."` message too - write a real one
# when tagging and it shows up as-is on the release, no separate step or
# GitHub-UI edit needed.
#
# Devices fetch .../releases/latest/download/manifest.json (see
# firmware/src/core/ota.h). "latest" skips prereleases and drafts, so to
# test a build on your own device before everyone sees it: tick
# "prerelease" on the release after it's created, point the device's
# manifest URL at that tag's asset URL directly, and untick it once happy.
name: Release firmware

on:
  push:
    tags:
      - "fw-v*"

permissions:
  contents: write   # needed to create the release + upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags needed for `git describe` in extra_script.py

      - name: Derive and verify the version from the tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#fw-v}"
          DESCRIBED="$(git describe --tags --match 'fw-v*' --dirty --always)"
          echo "tag=$TAG described=$DESCRIBED version=$VERSION"
          if [ "$DESCRIBED" != "$TAG" ]; then
            echo "::error::git describe gives '$DESCRIBED', expected exactly '$TAG' - refusing to publish a non-clean build"
            exit 1
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$VERSION' is not a plain x.y.z version - devices can't compare it"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build
        run: pio run -d firmware

      - name: Package binary + manifest
        run: |
          python tools/make_manifest.py \
            --version "${{ steps.ver.outputs.version }}" \
            --bin firmware/.pio/build/epaper/firmware.bin \
            --url "https://github.com/${{ github.repository }}/releases/download/${{ steps.ver.outputs.tag }}/firmware-${{ steps.ver.outputs.version }}.bin" \
            --out dist
          cat dist/manifest.json

      # Release notes are just the annotated tag's own message (`git tag -a
      # fw-vX.Y.Z -m "..."`) - one more thing that's never hand-edited after
      # the fact. `generate_release_notes: true` below still appends its own
      # "Full Changelog: prev...this" compare link underneath automatically;
      # GitHub's actual "What's Changed" bullet list needs merged PRs to
      # summarize, which this repo (plain pushes to master) doesn't have, so
      # without this step the release body was ever only that bare link.
      - name: Use the tag's own message as the release notes
        id: notes
        run: |
          {
            echo "body<<NOTES_EOF"
            git tag -l --format='%(contents)' "${{ steps.ver.outputs.tag }}"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Firmware ${{ steps.ver.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: true
          files: |
            dist/firmware-${{ steps.ver.outputs.version }}.bin
            dist/manifest.json
