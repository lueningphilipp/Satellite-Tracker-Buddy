; PlatformIO project for the e-paper build (see CLAUDE.md - mode 3 only, mode 1/2
; stay demo-only). Board is the Waveshare "e-Paper ESP32 Driver Board" (plain
; ESP32-WROOM-32 with fixed SPI pins wired on its PCB - see
; src/display/epaper_pins.h) paired with the 7.5" V2 800x480 panel.
;
; Core (WiFi/NTP/NVS/element-fetch/SGP4/web-config) is compiled, flashed, and
; verified working on real hardware - see CLAUDE.md's TODO and
; firmware/README.md. The display renderer is new and unverified.

[env:epaper]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    SparkFun SGP4 Arduino Library
    ESP32Async/ESPAsyncWebServer
    ESP32Async/AsyncTCP
    bblanchon/ArduinoJson @ ^7
    zinggjm/GxEPD2
    adafruit/Adafruit GFX Library

build_flags =
    -DCORE_DEBUG_LEVEL=1
