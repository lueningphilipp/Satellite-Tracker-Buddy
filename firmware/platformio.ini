; PlatformIO project for the e-paper build (see CLAUDE.md - mode 3 only, mode 1/2
; stay demo-only). Board is a plain ESP32-WROOM-32: this covers a bare DevKit
; *and* the Waveshare "e-Paper ESP32 Driver Board" (same chip, fixed SPI pins
; wired on its PCB - see core/display_pins.h once the display renderer lands).
;
; NOT YET COMPILED ON REAL HARDWARE. The SGP4 low-level init call in
; core/sgp4_track.cpp was written against Hopperpop/Sgp4-Library's actual
; GitHub source (verified function signatures), but the whole project still
; needs a first `pio run` against real hardware to catch anything a source
; read can't - see CLAUDE.md Next Steps #1.

[env:epaper]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    SparkFun SGP4 Arduino Library
    ESP32Async/ESPAsyncWebServer
    ESP32Async/AsyncTCP
    bblanchon/ArduinoJson @ ^7

build_flags =
    -DCORE_DEBUG_LEVEL=1
